# ==============================================================================
# EcoBite Backend - Tooling configuration (pytest / ruff / mypy)
# ==============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
# Run every async test & fixture automatically without @pytest.mark.asyncio
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Compatible across starlette versions (<0.38 lacks StarletteDeprecationWarning)
    "ignore::DeprecationWarning:starlette",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# python-jose does not ship type stubs
module = ["jose.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Pydantic v2 Field(gt=Decimal(...)) type stub expects float | None
module = ["app.schemas.*"]
disable_error_code = ["arg-type"]
